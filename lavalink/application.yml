server:
  port: ${SERVER_PORT:2333}
  address: 0.0.0.0

lavalink:
  server:
    # Set LAVALINK_SERVER_PASSWORD in the Railway service's variables —
    # this must match LAVALINK_PASSWORD in the bot's own env.
    password: ${LAVALINK_SERVER_PASSWORD}
    sources:
      # The classic built-in YouTube source was removed upstream (it kept
      # breaking against YouTube's changes) — youtube-source below
      # replaces it, so this stays off to avoid the two colliding.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

  plugins:
    - dependency: dev.lavalink.youtube:youtube-plugin:1.11.5
      repository: https://maven.lavalink.dev/releases

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  level:
    root: INFO
    lavalink: INFO
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 3
